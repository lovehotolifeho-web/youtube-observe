name: Build APK

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            git \
            wget \
            ccache \
            autoconf \
            libtool
      
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer cython
          pip install yt-dlp requests pillow plyer
      
      - name: Setup Android environment
        run: |
          mkdir -p ~/.android
          echo "sdk.dir=$HOME/Android/Sdk" > ~/.android/local.properties
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          export ANDROID_HOME=$HOME/Android/Sdk
      
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-
      
      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}
          restore-keys: gradle-${{ runner.os }}-
      
      - name: Display buildozer version
        run: buildozer --version
      
      - name: Build APK with verbose output
        run: |
          set -e
          echo "Starting APK build..."
          buildozer android debug 2>&1 || {
            echo "Build failed with exit code $?"
            echo "=== Checking log files ==="
            find ~/.buildozer -name "*.log" -type f -exec echo "--- {} ---" \; -exec tail -30 {} \;
            exit 1
          }
      
      - name: Check for APK file
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f -ls
          if [ -d "bin" ]; then
            ls -lah bin/
          else
            echo "bin/ directory does not exist"
          fi
      
      - name: Upload APK if built
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-observe-apk
          path: bin/*.apk
          retention-days: 30
