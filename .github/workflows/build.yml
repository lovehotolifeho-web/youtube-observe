name: Build APK

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev git wget autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev
      
      - run: pip install --upgrade pip buildozer cython
      
      - run: mkdir -p ~/.android && echo -e '\nandroid.accept_sdk_license=true' >> ~/.android/local.properties
      
      - run: |
          export ANDROID_ACCEPT_LICENSE=yes
          buildozer android debug 2>&1
      
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: bin/*.apk
