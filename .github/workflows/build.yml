name: Build APK

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: buildozer/buildozer:latest
    timeout-minutes: 180
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        run: |
          buildozer android debug
      
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: bin/*.apk
          retention-days: 30
