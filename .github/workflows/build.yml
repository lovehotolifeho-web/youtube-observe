name: Build APK

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Kivy Docker
        uses: docker://kivy/kivy:latest
        with:
          args: bash -c "apt-get update && apt-get install -y buildozer cython && buildozer android debug"
      
      - name: Check for APK
        run: |
          ls -lah bin/
          find . -name "*.apk" -type f
      
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: youtube-observe-apk
          path: bin/*.apk
          retention-days: 30
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: .buildozer/
          retention-days: 7
