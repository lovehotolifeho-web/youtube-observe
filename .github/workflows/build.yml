name: Build APK

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            git \
            wget \
            ccache \
            autoconf \
            libtool
      
      - name: Install Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install buildozer cython
          pip install yt-dlp requests pillow plyer
      
      - name: Setup Android SDK
        run: |
          mkdir -p ~/.android
          echo "sdk.dir=$HOME/Android/Sdk" > ~/.android/local.properties
      
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-
      
      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}
          restore-keys: |
            gradle-${{ runner.os }}-
      
      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
          echo "Build log:"
          tail -50 build.log
      
      - name: List build outputs
        if: always()
        run: |
          echo "=== Checking for APK files ==="
          find . -name "*.apk" -type f
          ls -lah bin/ 2>/dev/null || echo "bin/ directory not found"
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-observe-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: build.log
          retention-days: 7
